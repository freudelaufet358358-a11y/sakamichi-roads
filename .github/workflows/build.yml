# 道路データ（日本全国）を作って GitHub Pages に置く（毎月 1 日と、手動の「Run workflow」で）
name: build road data

on:
  schedule:
    # 毎月 1 日 18:00 UTC（日本時間 2 日 3:00）
    - cron: "0 18 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Geofabrik の日本の地方（https://download.geofabrik.de/asia/japan.html）。全国を 1 回で読むとメモリが足りないので地方ごとに作り、最後に合わせる
  REGIONS: hokkaido tohoku kanto chubu kansai chugoku shikoku kyushu

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install "osmium>=3.7,<5"

      - name: Extract each region
        run: |
          mkdir -p data work
          curl -fsSL -o data/japan.poly "https://download.geofabrik.de/asia/japan.poly"
          for r in $REGIONS; do
            echo "::group::$r"
            curl -fsSL -o "data/$r.osm.pbf" "https://download.geofabrik.de/asia/japan/$r-latest.osm.pbf"
            # 道と、信号・名前の付いた交差点だけにする（道の点も一緒に残る）
            osmium tags-filter "data/$r.osm.pbf" w/highway n/highway=traffic_signals n/junction=yes -o "data/$r-roads.osm.pbf" --overwrite
            rm "data/$r.osm.pbf"
            python build_cells.py extract "data/$r-roads.osm.pbf" --out "work/$r"
            rm "data/$r-roads.osm.pbf"
            echo "::endgroup::"
          done
          df -h .

      - name: Merge into cells
        run: |
          python build_cells.py merge --poly data/japan.poly --work work --out site --name japan $REGIONS
          rm -rf work
          cp README.md site/README.md
          touch site/.nojekyll
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
